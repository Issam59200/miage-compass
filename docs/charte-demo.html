<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propositions de palettes | MIAGE Compass</title>
  <!--
    Page de travail (pas une page du site) : compare des palettes possibles
    pour la charte graphique. Les contrastes sont calculés automatiquement
    (règle WCAG : 4,5:1 minimum pour du texte normal, niveau AA).
    Pour modifier une palette, il suffit de changer ses couleurs dans le
    tableau "palettes" du script en bas de page.
  -->
  <style>
    body {
      margin: 0;
      padding: 2rem 1.5rem 3rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
      color: #1d2526;
      background: #f3f1ed;
    }

    .intro { max-width: 70ch; margin-bottom: 2rem; }
    .intro h1 { margin: 0 0 0.5rem; font-size: 1.8rem; letter-spacing: -0.01em; }
    .intro p { margin: 0; color: #4a5354; }

    .palettes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2rem 1.5rem;
    }

    .palette h2 { margin: 0 0 0.2rem; font-size: 1.15rem; }
    .palette > p { margin: 0 0 0.9rem; color: #4a5354; font-size: 0.95rem; }

    .pastilles {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .pastille { width: 64px; font-size: 0.7rem; line-height: 1.3; }

    .pastille span {
      display: block;
      height: 34px;
      margin-bottom: 0.2rem;
      border: 1px solid rgb(0 0 0 / 0.12);
      border-radius: 6px;
    }

    /* ---- Mini-maquette, colorée par les variables de chaque palette ---- */
    .maquette {
      overflow: hidden;
      border: 1px solid var(--bordure);
      border-radius: 12px;
      color: var(--texte);
      background: var(--fond);
      box-shadow: 0 6px 20px -8px rgb(0 0 0 / 0.18);
    }

    .m-entete {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7rem 1rem;
      background: var(--entete-fond);
      color: var(--entete-texte);
      font-size: 0.85rem;
    }

    .m-marque { font-weight: 700; letter-spacing: 0.01em; }
    .m-marque b { color: var(--entete-accent); font-weight: 700; }

    .m-entete nav a {
      margin-left: 0.8rem;
      color: inherit;
      text-decoration: none;
      opacity: 0.9;
    }

    .m-entete nav a.actif {
      text-decoration: underline;
      text-decoration-color: var(--entete-accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
      opacity: 1;
    }

    .m-hero {
      position: relative;
      overflow: hidden;
      padding: 1.8rem 1.25rem 1.6rem;
      background: var(--hero-fond);
      color: var(--hero-texte);
    }

    /* Lignes de niveau façon carte topographique, en fond du hero */
    .m-hero svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: var(--motif);
      pointer-events: none;
    }

    .m-hero > *:not(svg) { position: relative; }
    .m-hero h3 { margin: 0 0 0.4rem; font-size: 1.45rem; line-height: 1.15; letter-spacing: -0.02em; max-width: 16ch; }
    .m-hero p { margin: 0 0 1.1rem; font-size: 0.92rem; max-width: 34ch; color: var(--hero-texte-doux); }

    .m-btn {
      display: inline-block;
      margin: 0 0.4rem 0.4rem 0;
      padding: 0.5rem 1rem;
      border: 2px solid var(--bouton-fond);
      border-radius: 999px;
      background: var(--bouton-fond);
      color: var(--bouton-texte);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .m-btn.secondaire {
      border-color: currentColor;
      background: transparent;
      color: var(--hero-texte);
    }

    .m-corps { padding: 1rem; }

    .m-carte {
      margin-bottom: 0.9rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--bordure);
      border-radius: 10px;
      background: var(--carte-fond);
      font-size: 0.9rem;
    }

    .m-carte-titre { display: flex; justify-content: space-between; gap: 0.5rem; }
    .m-carte-titre a { color: var(--principale); font-weight: 700; text-decoration: none; }
    .m-carte-dates { margin: 0.2rem 0 0.55rem; color: var(--texte-doux); font-variant-numeric: tabular-nums; }

    .m-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-right: 0.3rem;
      padding: 0.12rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .m-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .m-badge.verifie { background: var(--accent-doux); color: var(--accent-texte); }
    .m-badge.confirme { background: var(--confirme-fond); color: var(--confirme); }
    .m-badge.a-confirmer { background: var(--a-confirmer-fond); color: var(--a-confirmer); }

    .m-bandeau {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: var(--fond-alt);
      font-size: 0.9rem;
    }

    .m-bandeau svg { flex: none; width: 22px; height: 22px; margin-top: 0.1rem; color: var(--accent-texte); }
    .m-bandeau strong { display: block; color: var(--texte); }
    .m-bandeau span { color: var(--texte-doux); }

    table { width: 100%; margin-top: 1rem; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    th, td { padding: 0.28rem 0.4rem; border-bottom: 1px solid rgb(0 0 0 / 0.08); text-align: left; }
    th { color: #4a5354; font-weight: 600; }
    .ok { color: #166534; font-weight: 700; }
    .ko { color: #b91c1c; font-weight: 700; }
  </style>
</head>
<body>
  <div class="intro">
    <h1>MIAGE Compass : variations autour du pétrole et du corail</h1>
    <p>La palette B a été retenue comme base. Voici la version de départ et trois variations plus travaillées, chacune avec son ambiance, montrées sur une mini-maquette de l'accueil. Les contrastes sont vérifiés automatiquement.</p>
  </div>

  <div class="palettes" id="palettes"></div>

  <!-- Motif réutilisé dans chaque hero : lignes de niveau (carte topographique) -->
  <template id="motif">
    <svg viewBox="0 0 400 220" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M250 110c0-38 30-62 66-60s60 30 58 64-34 58-70 56-54-24-54-60z"/>
        <path d="M222 112c-2-56 42-90 96-88s92 44 88 94-48 86-102 84-80-36-82-90z"/>
        <path d="M194 116c-4-74 54-118 126-116s122 58 116 124-64 112-134 110-104-48-108-118z"/>
        <path d="M166 120c-6-92 66-146 156-144s150 72 142 154-78 138-166 136-126-60-132-146z"/>
        <path d="M138 124c-8-110 78-174 186-172s178 86 168 184-92 164-198 162-148-72-156-174z"/>
      </g>
    </svg>
  </template>

  <script>
    // Couleurs de statut, communes à toutes les palettes
    const statuts = {
      confirme: "#166534", "confirme-fond": "#dcfce7",
      "a-confirmer": "#92400e", "a-confirmer-fond": "#fef3c7"
    };

    const palettes = [
      {
        nom: "B. Pétrole et corail (départ)",
        idee: "La palette choisie, telle quelle : fond blanc, pétrole pour la structure, corail en accent.",
        couleurs: {
          principale: "#0f5257", accent: "#c2412d", texte: "#172426", "texte-doux": "#4b5f61",
          fond: "#ffffff", "fond-alt": "#f1f6f6", bordure: "#cfdede", "carte-fond": "#ffffff",
          "accent-doux": "#fbe6e1", "accent-texte": "#b23a27",
          "entete-fond": "#f1f6f6", "entete-texte": "#0f5257", "entete-accent": "#c2412d",
          "hero-fond": "#f1f6f6", "hero-texte": "#172426", "hero-texte-doux": "#4b5f61",
          "bouton-fond": "#0f5257", "bouton-texte": "#ffffff", motif: "#dae8e8"
        }
      },
      {
        nom: "B1. Carte marine",
        idee: "Fond papier crème au lieu du blanc, comme une carte imprimée. Plus chaleureux, le corail devient le bouton principal.",
        couleurs: {
          principale: "#0f4c55", accent: "#c8452f", texte: "#16282b", "texte-doux": "#4a5c5e",
          fond: "#fbf8f3", "fond-alt": "#f2ebe0", bordure: "#e2d8c8", "carte-fond": "#fffdf9",
          "accent-doux": "#f8e0d8", "accent-texte": "#a8361f",
          "entete-fond": "#fbf8f3", "entete-texte": "#0f4c55", "entete-accent": "#c8452f",
          "hero-fond": "#f2ebe0", "hero-texte": "#16282b", "hero-texte-doux": "#4a5c5e",
          "bouton-fond": "#c8452f", "bouton-texte": "#ffffff", motif: "#e2d6c3"
        }
      },
      {
        nom: "B2. Lagune",
        idee: "Fond très légèrement teinté d'eau, pétrole plus lumineux, corail franc. Frais et moderne, sans perdre en sérieux.",
        couleurs: {
          principale: "#0b5c63", accent: "#d4553d", texte: "#10292c", "texte-doux": "#43605f",
          fond: "#f6faf9", "fond-alt": "#e3efed", bordure: "#c6dcd9", "carte-fond": "#ffffff",
          "accent-doux": "#fde4dd", "accent-texte": "#b03f29",
          "entete-fond": "#0b5c63", "entete-texte": "#f6faf9", "entete-accent": "#ffb4a1",
          "hero-fond": "#e3efed", "hero-texte": "#10292c", "hero-texte-doux": "#43605f",
          "bouton-fond": "#0b5c63", "bouton-texte": "#ffffff", motif: "#c3dcd8"
        }
      },
      {
        nom: "B3. Pétrole profond",
        idee: "En-tête et accueil sur un pétrole très sombre, corail lumineux pour l'action, contenu sur fond clair. Le plus marquant des trois.",
        couleurs: {
          principale: "#12505a", accent: "#ff8f73", texte: "#14262a", "texte-doux": "#4a5d61",
          fond: "#faf7f2", "fond-alt": "#efe9df", bordure: "#ddd4c6", "carte-fond": "#ffffff",
          "accent-doux": "#fde3db", "accent-texte": "#ad3a25",
          "entete-fond": "#0c3036", "entete-texte": "#f4efe6", "entete-accent": "#ff8f73",
          "hero-fond": "#0c3036", "hero-texte": "#f4efe6", "hero-texte-doux": "#c3d2d0",
          "bouton-fond": "#ff8f73", "bouton-texte": "#2a0f08", motif: "#17444b"
        }
      }
    ];

    // Calcul du contraste WCAG entre deux couleurs
    function luminance(hex) {
      const rgb = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
      const lin = rgb.map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
      return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
    }

    function contraste(a, b) {
      const [l1, l2] = [luminance(a), luminance(b)].sort((x, y) => y - x);
      return (l1 + 0.05) / (l2 + 0.05);
    }

    // Couleurs montrées en pastilles (les autres sont des dérivées)
    const principales = ["principale", "accent", "texte", "fond", "fond-alt", "hero-fond"];
    const motif = document.querySelector("#motif").innerHTML;
    const iconeVerifie = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>`;
    const conteneur = document.querySelector("#palettes");

    for (const p of palettes) {
      const c = { ...p.couleurs, ...statuts };

      const tests = [
        ["Texte sur fond", c.texte, c.fond],
        ["Texte secondaire sur fond", c["texte-doux"], c.fond],
        ["Texte sur fond alterné", c.texte, c["fond-alt"]],
        ["Liens sur fond", c.principale, c.fond],
        ["Menu sur en-tête", c["entete-texte"], c["entete-fond"]],
        ["Titre du hero", c["hero-texte"], c["hero-fond"]],
        ["Texte secondaire du hero", c["hero-texte-doux"], c["hero-fond"]],
        ["Bouton principal", c["bouton-texte"], c["bouton-fond"]],
        ["Badge « vérifié »", c["accent-texte"], c["accent-doux"]],
        ["Badge « confirmé »", c.confirme, c["confirme-fond"]],
        ["Badge « à confirmer »", c["a-confirmer"], c["a-confirmer-fond"]]
      ];

      const lignes = tests.map(([nom, a, b]) => {
        const r = contraste(a, b);
        const ok = r >= 4.5;
        return `<tr><td>${nom}</td><td>${r.toFixed(1)}:1</td>` +
          `<td class="${ok ? "ok" : "ko"}">${ok ? "AA ✓" : "insuffisant"}</td></tr>`;
      }).join("");

      const pastilles = principales.map((nom) =>
        `<div class="pastille"><span style="background:${c[nom]}"></span>${nom}<br>${c[nom]}</div>`
      ).join("");

      const variables = Object.entries(c).map(([nom, val]) => `--${nom}:${val}`).join(";");

      const bloc = document.createElement("section");
      bloc.className = "palette";
      bloc.innerHTML = `
        <h2>${p.nom}</h2>
        <p>${p.idee}</p>
        <div class="pastilles">${pastilles}</div>
        <div class="maquette" style="${variables}">
          <div class="m-entete">
            <span class="m-marque">MIAGE <b>Compass</b></span>
            <nav><a href="#" class="actif">Calendrier</a><a href="#">Guide</a><a href="#">FAQ</a></nav>
          </div>
          <div class="m-hero">
            ${motif}
            <h3>Candidater en MIAGE, partout en France</h3>
            <p>Les dates, les démarches et les réponses à vos questions, au même endroit.</p>
            <span class="m-btn">Voir le calendrier</span>
            <span class="m-btn secondaire">Lire le guide</span>
          </div>
          <div class="m-corps">
            <div class="m-carte">
              <div class="m-carte-titre"><a href="#">MIAGE Lille · M1</a></div>
              <div class="m-carte-dates">Ouvre le 01/03 · clôt le 15/04</div>
              <span class="m-badge verifie">vérifié le 12/01</span>
              <span class="m-badge confirme">confirmé</span>
              <span class="m-badge a-confirmer">à confirmer</span>
            </div>
            <div class="m-bandeau">
              ${iconeVerifie}
              <div><strong>Des informations vérifiées</strong><span>Chaque date a sa source officielle et sa date de vérification.</span></div>
            </div>
          </div>
        </div>
        <table>
          <thead><tr><th>Combinaison</th><th>Contraste</th><th>Résultat</th></tr></thead>
          <tbody>${lignes}</tbody>
        </table>`;
      conteneur.appendChild(bloc);
    }
  </script>
</body>
</html>
